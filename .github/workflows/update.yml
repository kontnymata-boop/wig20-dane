name: Aktualizacja notowań WIG20

on:
  schedule:
    # co 20 minut w trakcie sesji GPW (godziny w UTC; obejmuje czas zimowy i letni)
    - cron: '*/20 6-16 * * 1-5'
    # po zamknięciu sesji
    - cron: '50 16 * * 1-5'
  # od razu po zmianie automatu (np. przy pierwszym wgraniu)
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wig20-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteki
        run: pip install "curl_cffi>=0.7"
      - name: Pobierz notowania
        run: python scripts/update.py
      - name: Zapisz dane w repozytorium
        run: |
          git config user.name "wig20-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          git commit -m "Notowania $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
