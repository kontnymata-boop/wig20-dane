name: Próba danych finansowych
on:
  workflow_dispatch:
    inputs:
      syms:
        description: 'Symbole Yahoo'
        default: 'PKN.WA PKO.WA MBR.WA PCO.WA ENA.WA'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "curl_cffi>=0.7"
      - run: python probe/probe.py ${{ inputs.syms }}
