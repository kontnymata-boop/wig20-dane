name: Sonda komunikatów (jednorazowa)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml', 'scripts/probe_news.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "curl_cffi>=0.7"
      - run: python scripts/probe_news.py
